name: Construire les installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publier une Release GitHub avec les installateurs'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MERCI-TV-Gestion-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: MERCI TV Gestion ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Installer MERCI TV Gestion ${{ steps.v.outputs.version }}

            **Windows 10 / 11**
            - `MERCI-TV-Gestion-Setup-${{ steps.v.outputs.version }}.exe` — installateur (recommandé)
            - `MERCI-TV-Gestion-Portable-${{ steps.v.outputs.version }}.exe` — version sans installation (clé USB)
            - Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires → Exécuter quand même*.

            **macOS 11 et plus**
            - Mac Apple Silicon (M1, M2, M3, M4) : `MERCI-TV-Gestion-${{ steps.v.outputs.version }}-mac-arm64.dmg`
            - Mac Intel : `MERCI-TV-Gestion-${{ steps.v.outputs.version }}-mac-x64.dmg`
            - Glissez l’application dans *Applications*, puis au premier lancement : *clic droit → Ouvrir → Ouvrir*.
            - Si macOS indique que l’application est « endommagée » : `xattr -cr "/Applications/MERCI TV Gestion.app"` dans le Terminal.

            Au premier démarrage, l’assistant crée le compte administrateur. Voir le README pour le guide complet.
          files: artifacts/*
